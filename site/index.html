<template id="tpl-method">
  <div class="method">
    <p><b>The measure.</b> Sales growth for one quarter against the same quarter a year earlier, on the underlying basis each company publishes: organic at LVMH and Prada, constant exchange rates at Hermès, Richemont and Moncler, comparable at Kering. All of them strip out currency. Organic and comparable also strip out acquisitions and disposals. The bases are close, and the basis is shown next to every company.</p>
    <p><b>Calendar quarters.</b> Periods are filed under the calendar quarter in which they end. Richemont's financial year ends in March, so its July to September quarter (Q2 FY27) is listed as Q3 2026.</p>
    <p><b>Regions.</b> Companies cut the world differently. Each reported region goes into one of five buckets and keeps the company's own label. Where a bucket is a loose fit, the figure carries a note: LVMH reports the United States, Moncler's Asia includes Japan and Korea, and Moncler's EMEA includes the Middle East.</p>
    <p><b>Scope differences.</b> Prada's quarterly series is retail sales on an organic basis, which is 87% of its revenue and the only measure it gives by quarter and by region. Moncler's regions are for the Moncler brand. LVMH and Kering give regional growth in their results presentations, taken here from trade press reports. Those figures are marked Press on the Data screen.</p>
    <p><b>Nothing is derived.</b> No quarter is backed out of year-to-date figures and no missing number is estimated. An empty cell means the company did not publish it. Figures keep the rounding of the source.</p>
    <p><b>Model.</b> Change is growth against the prior quarter, in points. Two-year growth compounds this quarter with the same quarter a year earlier. The base is the growth being lapped: a higher base next quarter makes growth harder to show. The Asia gap is Asia ex-Japan growth minus group growth.</p>
    <p><b>Signals.</b> Fixed rules, so the same numbers always give the same words. Accelerating or slowing needs a move of at least <span data-t="momentum_pts">1</span> point. Ahead of or behind peers needs <span data-t="level_pts">2</span> points from the median of the others. An Asia drag or lift needs a gap of <span data-t="asia_gap_pts">3</span> points. A base effect is flagged from <span data-t="base_shift_pts">2</span> points.</p>
    <p><b>Checks.</b> A figure found by the pipeline enters the dataset only when its quoted words and its number are both in the release. Each update arrives as a pull request for a person to approve. The checks catch copying errors. They do not confirm that a release is genuine, so research is limited to company sites and regulatory wires.</p>
    <p><b>Use.</b> This is a study project built from public company releases. It gives no investment advice.</p>
  </div>
</template>
