name: Update data

# Checks the watchlist for new releases every Monday and opens a pull request when it finds one.
# Needs a repository secret named ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      company:
        description: "Watchlist id to check (leave empty for all)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Research, extract, verify, model, interpret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPANY: ${{ inputs.company }}
        run: |
          if [ -n "$COMPANY" ]; then
            python -m pipeline.run update --apply --company "$COMPANY"
          else
            python -m pipeline.run update --apply
          fi
      - run: python -m unittest discover -s tests
      - name: Open a pull request when the dataset or the review folder changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/companies.json data/review)" ]; then
            echo "No new figures. Nothing to review."
            exit 0
          fi
          branch="data-update-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A data site/data.json
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create --title "Data update $(date -u +%Y-%m-%d)" \
            --body "Found by the scheduled pipeline. Figures that matched their release word for word are merged into data/companies.json. Anything else is in data/review for a person to check. Review the diff before merging."
